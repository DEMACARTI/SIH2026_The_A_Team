; PlatformIO build for the reference sketch. Arduino IDE users can instead open
; sonar_tx/sonar_tx.ino directly (board: "ESP32 Dev Module", lib: ArduinoJson 7).
;
;   pio run -d firmware                 # build
;   pio run -d firmware -t upload       # flash
;   pio device monitor -b 115200        # watch the JSON lines

[platformio]
src_dir = sonar_tx

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7
